<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo con Clases e IDs</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 2em;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            line-height: 1.6;
            color: #333;
        }

        .card-seccion {
            background-color: #ffffff;
            border-left: 6px solid #007bff;
            padding: 2em;
            margin-bottom: 1.5em;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .card-seccion:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        }

        .card-seccion h2 {
            color: #007bff;
            margin-top: 0;
            font-size: 1.8em;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5em;
        }

        .card-seccion p {
            font-size: 1.05em;
        }

        #footer-recurso {
            margin-top: 1.5em;
            padding-top: 1em;
            border-top: 2px dashed #dcdcdc;
            font-size: 0.9em;
            color: #666;
            background-color: #f9fafb;
            padding: 1em;
            border-radius: 8px;
        }

        .link-externo {
            color: #d9534f;
            font-weight: bold;
            text-decoration: none;
            padding: 0.2em 0.5em;
            border-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .link-externo:hover {
            text-decoration: none;
            background-color: #d9534f;
            color: #fff;
        }

        code {
            background-color: #e2e8f0;
            padding: 0.2em 0.5em;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <section class="card-seccion">
        <h2>Ejemplo Práctico: Navegación Web</h2>
        <p>El siguiente párrafo contiene un hipervínculo que redirige al usuario hacia una página externa:</p>

        <p>
            Para obtener más información técnica, puedes visitar el siguiente
            <a href="https://es.wikipedia.org/wiki/PHP" target="_blank" rel="noopener" class="link-externo">Enlace a PHP</a>
        </p>

        <footer id="footer-recurso">
            <p><strong>Nota:</strong> Este enlace abre una fuente externa de consulta académica. Última revisión: 2026.</p>
        </footer>
    </section>

</body>
</html>
