<!DOCTYPE html>

    <title>Ejemplo de Tabla</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2em;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            border: 3px solid #2c3e50;
        }

        caption {
            caption-side: top;
            font-size: 1.6em;
            font-weight: bold;
            color: #2c3e50;
            padding: 1em;
            background-color: #f8f9fa;
            border-bottom: 3px solid #2c3e50;
            letter-spacing: 1px;
        }

        th, td {
            padding: 0.9em 1.2em;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #34495e;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 0.5px;
        }

        /* Encabezados de fila (ciudades y fechas) */
        th[id], th[headers] {
            background-color: #ecf0f1;
            color: #2c3e50;
            font-weight: 700;
            text-align: left;
        }

        th[id] {
            background-color: #3498db;
            color: #fff;
            font-size: 1.1em;
            text-align: center;
        }

        tr:nth-child(even) td {
            background-color: #f8f9fa;
        }

        tr:hover td {
            background-color: #eaf2f8;
            transition: background-color 0.3s ease;
        }

        /* Fila de subtotales */
        tr:last-child th,
        tr:last-child td {
            font-weight: bold;
            background-color: #d5f5e3;
            color: #1e8449;
            border-top: 2px solid #27ae60;
        }

        /* Bordes laterales para simular marco */
        table::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            pointer-events: none;
            box-shadow: inset 0 0 0 3px #2c3e50;
        }

        /* Ajuste para que el marco se vea bien */
        table {
            position: relative;
        }
    </style>
</head>
<body>

<table>
    <caption>Informe de gastos de viaje</caption>
    <tr>
        <th></th>
        <th>Comida</th>
        <th>Hotel</th>
        <th>Transporte</th>
        <th>Subtotal</th>
    </tr>

    <tr>
        <th id="buenos-aires" axis="buenos-aires">Buenos Aires</th>
    </tr>
    <tr>
        <th headers="buenos-aires">25-Ago-97</th>
        <td>37.34</td>
        <td>112.00</td>
        <td>45.00</td>
        <td></td>
    </tr>
    <tr>
        <th headers="buenos-aires">26-Ago-97</th>
        <td>27.28</td>
        <td>112.00</td>
        <td>45.00</td>
        <td></td>
    </tr>
    <tr>
        <th headers="buenos-aires">Subtotales</th>
        <td>65.00</td>
        <td>224.00</td>
        <td>90.00</td>
        <td>379.02</td>
    </tr>

    <tr>
        <th id="cordoba" axis="cordoba">Córdoba</th>
    </tr>
    <tr>
        <th headers="cordoba">27-ago97</th>
        <td>96.00</td>
        <td>109.00</td>
        <td>36.00</td>
        <td></td>
    </tr>
    <tr>
        <th headers="cordoba">28-ago97</th>
        <td>35.00</td>
        <td>109.00</td>
        <td>36.00</td>
        <td></td>
    </tr>
    <tr>
        <th headers="cordoba">Subtotales</th>
        <td>196.27</td>
        <td>442.00</td>
        <td>162.00</td>
        <td>800.27</td>
    </tr>
</table>

</body>
</html>
